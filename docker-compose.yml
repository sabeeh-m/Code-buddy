services:
  redis:
    image: redis:alpine
    container_name: agent_redis
    ports:
      - "6379:6379"
    restart: always

  app:
    build: .
    container_name: agent_harness_app
    depends_on:
      - redis
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: always